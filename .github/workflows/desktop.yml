# Builds the desktop app: BeeTracker.exe (Windows) and BeeTracker.dmg (macOS, Apple silicon).
# It runs when the app, helper or page change; run it by hand from the Actions tab (Run workflow),
# or push a tag like v1.0 to also attach both to a release.
name: Desktop app

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["app/**", "helper/**", "src/**", "tools/**", ".github/workflows/desktop.yml"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: dist/BeeTracker.exe
            extra: nidaqmx
          - os: macos-latest
            file: dist/BeeTracker.dmg
            extra: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pyinstaller numpy pytest ${{ matrix.extra }}
      - run: node --test tests/core.test.cjs
      - run: python -m pytest -q tests/test_led_helper.py   # includes a check that the page and helper make the same waveform
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: BeeTracker-${{ runner.os }}
          path: ${{ matrix.file }}
      - if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || true; gh release upload "$GITHUB_REF_NAME" "${{ matrix.file }}" --clobber
